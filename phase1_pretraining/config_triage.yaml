# Phase 1: TRIAGE CONFIG — Strip all regularization, raw channels only
# =====================================================================
# Based on deep analysis of F1=0.17 failure. Three root causes identified:
#
# 1. REGULARIZATION CATASTROPHE: FocalLoss + label_smoothing + mixup +
#    BalancedBatchSampler create contradictory training signals.
#    FocalLoss demands confident predictions; label smoothing punishes them.
#    Published evidence: FL+LS = 40.5% accuracy; FL alone = 86.2%.
#
# 2. DERIVED CHANNELS INJECT NOISE: d_torque_dt via finite differences
#    amplifies noise 100x at 100Hz. torque_norm destroys magnitude info
#    that separates over_torque from normal.
#
# 3. This config is the MINIMAL VIABLE baseline to diagnose the problem.
#    If training F1 > 0.80 but val F1 < 0.30 → overfitting (add back ONE regularizer)
#    If training F1 < 0.30 → data/feature problem (run Fisher Discriminant analysis)
#
# Changes from config.yaml:
#   - loss: CrossEntropyLoss (no focal, no label smoothing)
#   - optimizer: Adam (no weight decay)
#   - mixup: disabled (prob=0)
#   - channels: raw_only (6 channels, no derived)
#   - model c_in: 6 (was 12)

experiment:
  name: phase1_triage_v1
  seed: 42

data:
  dataset_dir: ../data/synthetic_v2
  window_size: 1000
  window_stride: 250
  channels_mode: raw_only
  raw_channels: [torque_ftlbs, rpm, pressure_psi, oil_temp_f, turns, hookload_klbs]
  derived_channels: []
  total_channels: 6
  split_ratio: [0.70, 0.15, 0.15]
  split_seed: 42
  num_workers: 0
  pin_memory: false
  fault_threshold: 0.05

model:
  architecture: InceptionTime
  c_in: 6
  c_out: 9
  nf: 32
  depth: 6
  dropout: 0.2
  ensemble_size: 5
  ensemble_seeds: [0, 1, 2, 3, 4]

training:
  optimizer: Adam
  lr: 0.001
  weight_decay: 0.0
  warmup_epochs: 10
  scheduler_eta_min: 0.00001
  batch_size: 64
  max_epochs: 100
  early_stop_patience: 20
  early_stop_metric: val_macro_f1
  gradient_clip: 1.0
  mixed_precision: true

loss:
  type: CrossEntropyLoss
  label_smoothing: 0.0

augmentation:
  mixup_alpha: 0.0
  mixup_prob: 0.0

sampler:
  type: BalancedBatchSampler
  samples_per_class: 7

class_map:
  normal_casing_ltc: 0
  normal_casing_btc: 0
  normal_casing_premium: 0
  normal_drill_pipe: 0
  normal_tubing: 0
  normal_breakout: 0
  full_cycle: 0
  multi_connection: 0
  cold_start: 0
  hot_environment: 0
  cross_thread: 1
  connection_jump: 1
  stick_slip: 1
  staged_fault: 1
  galling: 2
  stripped_thread: 3
  over_torque: 4
  washout: 4
  under_torque: 5
  wrong_compound: 6
  misaligned_stabbing: 7
  stall: 8

class_names:
  - normal_makeup
  - cross_thread
  - galling
  - stripped_thread
  - over_torque
  - under_torque
  - wrong_compound
  - misaligned_stab
  - stall
